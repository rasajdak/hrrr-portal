# /etc/nginx/sites-available/hrrr-portal  (symlink into sites-enabled/)
# Reverse-proxies the gunicorn service and lets nginx serve/cach-e the PNGs.
# Who answers. The drawing Mac serves the site when it is there: it holds an
# ssh connection open that makes its app appear here on 8001 (deploy/mac/
# serve.sh). When that port is dead, or the app behind it is, the request goes
# to this machine's own copy instead, which draws what it is asked for.
upstream portal {
    server 127.0.0.1:8001 max_fails=2 fail_timeout=20s;
    server 127.0.0.1:8000 backup;
}

server {
    listen 80;
    server_name _;                 # replace with your domain, then run certbot

    client_max_body_size 4m;

    location / {
        proxy_pass         http://portal;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_read_timeout 300s;
        # fail over at once on a dead line, never after a slow map
        proxy_connect_timeout 3s;
        proxy_next_upstream error timeout http_502 http_503;
        proxy_next_upstream_timeout 10s;
        add_header         X-Served-By $upstream_addr always;
    }

    # Always this machine: the sensors and the panels poll these around the
    # clock, and the air-quality token lives only here.
    location ~ ^/api/(purpleair|panel|tiles/) {
        proxy_pass         http://127.0.0.1:8000;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_read_timeout 300s;
    }

    # rendered overlays are content-addressed & cacheable
    location /api/overlay {
        proxy_pass         http://portal;
        proxy_connect_timeout 3s;
        proxy_next_upstream_timeout 10s;
        proxy_set_header   Host $host;
        proxy_read_timeout 300s;
        proxy_cache_valid  200 1h;
        add_header         X-Cache $upstream_cache_status;
    }
}
