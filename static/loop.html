<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Futurecast loop</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@500;600&display=swap" />
<style>
  :root{ --bg:#0b1017; --panel:#131b26; --panel2:#1b2634; --line:#243244; --ink:#e8eef6; --muted:#8ea3bd; --accent:#4ea3ff; --accent2:#33d69f; }
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:Barlow,"Helvetica Neue",Helvetica,Arial,sans-serif}
  #wrap{max-width:1500px;margin:0 auto;padding:12px 14px 20px}
  #bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:10px}
  #bar h1{font-family:"Barlow Condensed",Barlow,sans-serif;font-size:24px;font-weight:600;margin:0 8px 0 0;white-space:nowrap}
  .group{display:flex;align-items:center;gap:7px}
  .group>label{font-size:13px;color:var(--muted);font-weight:500}
  select,button,a.btn{font:inherit;font-size:13.5px;font-weight:500;color:var(--ink);background:var(--panel2);
    border:1px solid var(--line);border-radius:8px;padding:6px 10px;cursor:pointer;text-decoration:none}
  select:hover,button:hover,a.btn:hover{border-color:var(--accent)}
  button.primary{background:var(--accent);border-color:var(--accent);color:#04121f;font-weight:600;min-width:70px}
  button:disabled{opacity:.5;cursor:default}
  button.step{padding:6px 9px;font-size:15px;line-height:1}
  .sp{flex:1}
  /* the stage is a 1920 x 1080 picture; the page only scales it */
  #stage{display:block;width:100%;height:auto;border-radius:10px;background:#fff;aspect-ratio:16/9;margin:0 auto}
  /* upright: a 1080 x 1920 reel, shown as tall as the window allows */
  #stage.tall{aspect-ratio:9/16;width:auto;height:min(82vh,1920px);max-width:100%}
  #under{display:flex;align-items:center;gap:12px;margin-top:10px}
  #scrub{flex:1;accent-color:var(--accent)}
  #note{font-size:13px;color:var(--muted);min-width:210px;text-align:right;font-variant-numeric:tabular-nums}
  #help{font-size:12.5px;color:var(--muted);margin-top:8px;line-height:1.45}
</style>
</head>
<body>
<div id="wrap">
  <div id="bar">
    <h1>Futurecast loop</h1>
    <div class="group"><label for="kind">Show</label>
      <select id="kind"><option value="radar">Radar</option><option value="temp">Temperature</option><option value="gust">Wind gusts</option></select></div>
    <div class="group"><label for="model">Model</label><select id="model"></select></div>
    <div class="group"><label for="region">Region</label><select id="region"></select></div>
    <div class="group" title="Which model run the loop plays. Times are Eastern. A dot marks a run whose frames are already drawn.">
      <label for="runsel">Run</label>
      <button id="runolder" class="step" title="The run before this one">‹</button>
      <select id="runsel"></select>
      <button id="runnewer" class="step" title="The run after this one">›</button>
    </div>
    <div class="group"><label for="shape">Shape</label>
      <select id="shape"><option value="wide">Landscape 16:9</option><option value="tall">Vertical 9:16 (reels)</option></select></div>
    <div class="group"><label for="speed">Speed</label>
      <select id="speed"><option value="0.5">Slow</option><option value="1" selected>Normal</option><option value="2">Fast</option></select></div>
    <span class="sp"></span>
    <button id="rec" title="Records the whole loop, start to finish, and downloads it as a video. Nothing else to press.">Save as video</button>
    <a class="btn" href="/">Static maps</a>
  </div>
  <canvas id="stage" width="1920" height="1080"></canvas>
  <div id="under">
    <button id="play" class="primary">Pause</button>
    <input type="range" id="scrub" min="0" max="1000" value="0" step="1" />
    <span id="note">loading…</span>
  </div>
  <div id="help"></div>
</div>

<script>
(function(){
  "use strict";
  var $=function(id){ return document.getElementById(id); };
  // Landscape: a title strip over the map. Vertical: the map fills the whole
  // reel between two matching, centred bands: the name and a large day and
  // time at the top, the legend and the site at the foot. An app's caption
  // will sit over the foot band on a posted reel; the time, at the top, is the
  // part that has to stay readable.
  var W=1920, H=1080, HEAD=75, MW=1920, MH=1005, TALL=false;
  try{ TALL=localStorage.getItem("loopshape")==="tall"; }catch(e){}
  function setShape(){
    if(TALL){ W=1080; H=1920; HEAD=0; MW=1080; MH=1920; } else { W=1920; H=1080; HEAD=75; MW=1920; MH=1005; }
    stage.width=W; stage.height=H; stage.classList.toggle("tall",TALL);
    glc.width=MW; glc.height=MH;
  }
  function regionKey(){ return REGION+(TALL?"@tall":""); }

  var stage=$("stage"), ctx=stage.getContext("2d");
  // The weather is drawn on its own WebGL canvas and laid between the base and
  // the labels on the stage, so the stage is one flat picture that can be
  // recorded as it is.
  var glc=document.createElement("canvas"); glc.width=MW; glc.height=MH;
  var gl=glc.getContext("webgl2",{premultipliedAlpha:true,alpha:true,antialias:false});

  var META=null, baseImg=null, topImg=null, tex=[], flow=[], loaded=0, token=0;
  var head=0, playing=true, last=0, hold=0, recorder=null, wantVideo=false, savedNote="";
  var MODEL="hrrr", REGION="wny", RUN=null, KIND="radar";   // RUN null: the newest complete run
  var cityVals=[];                                      // per frame, each city's number (temperature, gusts)
  try{ MODEL=localStorage.getItem("loopmodel")||MODEL; REGION=localStorage.getItem("region")||REGION; KIND=localStorage.getItem("loopkind")||KIND; }catch(e){}
  if(["radar","temp","gust"].indexOf(KIND)<0) KIND="radar";
  var HELP={
    radar:"Simulated radar from the model, coloured by what is falling: green rain, pink wintry mix, blue snow. Between forecast times the weather is carried along its own motion, so bands travel. Space plays and pauses.",
    temp:"The model's temperature 2 m above the ground, with the number at each city. The freezing line is where blue turns green. Space plays and pauses.",
    gust:"The strongest wind gusts the model expects near the ground, with the number at each city. Calm air under about 15 mph is left clear. Space plays and pauses."
  };
  if(REGION==="conus"&&!localStorage.getItem("loopregion")) REGION="wny";
  try{ REGION=localStorage.getItem("loopregion")||REGION; }catch(e){}

  // ---- shader: two forecast times in, one blended, coloured picture out ----
  var prog=null, palTex=null, stillTex=null, U={};
  function shader(type,src){ var s=gl.createShader(type); gl.shaderSource(s,src); gl.compileShader(s);
    if(!gl.getShaderParameter(s,gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s)); return s; }
  function initGL(){
    var vs="#version 300 es\nin vec2 p; out vec2 uv; void main(){ uv=vec2(p.x*.5+.5, .5-p.y*.5); gl_Position=vec4(p,0.,1.); }";
    var fs=[
      "#version 300 es","precision highp float;",
      "uniform sampler2D A, B, PAL, F; uniform float t; uniform vec2 fs; in vec2 uv; out vec4 o;",
      // one number a pixel (temperature, gusts): its scale, how opaque, and the
      // stretch at the bottom that fades out (c0 == c1: none)
      "uniform int mode; uniform float lo, hi, alpha, c0, c1;",
      // one colour family: six stops across 5..55 dBZ, flat steps with soft joins
      "vec3 ramp(int g, float d){",
      "  float x=clamp((d-5.)/10., 0., 4.999); int i=int(floor(x)); float f=smoothstep(.30,.70,fract(x));",
      "  return mix(texelFetch(PAL, ivec2(g*6+i,0), 0).rgb, texelFetch(PAL, ivec2(g*6+i+1,0), 0).rgb, f); }",
      "void main(){",
      "  if(mode==1){",
      // blended in place: these fields change where they are as much as they move
      "    float s=mix(texture(A,uv).r, texture(B,uv).r, t);",
      "    vec3 c=texture(PAL, vec2((s*255.+.5)/256., .5)).rgb;",
      "    float a=alpha*(c1>c0 ? smoothstep(c0,c1,lo+s*(hi-lo)) : 1.);",
      "    o=vec4(c*a, a); return; }",
      // F is how far the weather travels from A to B. Slide A forward along it
      // and B back, then blend: a band moves, where a plain fade would dim it
      // in one place and brighten it in the next.
      "  vec2 d=(texture(F,uv).rg*255.-128.)/127.*fs;",
      "  vec3 v=mix(texture(A,uv-t*d).rgb, texture(B,uv+(1.-t)*d).rgb, t)*75.;",   // rain, mix, snow, in dBZ
      "  float m=max(v.r, max(v.g, v.b));",
      "  if(m<3.){ o=vec4(0.); return; }",
      // whichever type is strongest owns the pixel; near a tie the colours blend
      "  vec3 w=pow(v/m, vec3(6.)); w/=(w.r+w.g+w.b);",
      "  vec3 c=w.r*ramp(0,m)+w.g*ramp(1,m)+w.b*ramp(2,m);",
      "  float a=smoothstep(4.,9.,m)*.90;",
      "  o=vec4(c*a, a); }"].join("\n");
    prog=gl.createProgram(); gl.attachShader(prog,shader(gl.VERTEX_SHADER,vs)); gl.attachShader(prog,shader(gl.FRAGMENT_SHADER,fs));
    gl.linkProgram(prog); gl.useProgram(prog);
    var buf=gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER,buf);
    gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1, 1,-1, -1,1, 1,1]),gl.STATIC_DRAW);
    var loc=gl.getAttribLocation(prog,"p"); gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc,2,gl.FLOAT,false,0,0);
    ["A","B","PAL","F","t","fs","mode","lo","hi","alpha","c0","c1"].forEach(function(n){ U[n]=gl.getUniformLocation(prog,n); });
    gl.uniform1i(U.A,0); gl.uniform1i(U.B,1); gl.uniform1i(U.PAL,2); gl.uniform1i(U.F,3);
    gl.pixelStorei(gl.UNPACK_ALIGNMENT,1);
    // "no motion", used until a pair's flow arrives (and for good if it never does)
    stillTex=gl.createTexture(); gl.activeTexture(gl.TEXTURE3); gl.bindTexture(gl.TEXTURE_2D,stillTex);
    gl.texImage2D(gl.TEXTURE_2D,0,gl.RGB,1,1,0,gl.RGB,gl.UNSIGNED_BYTE,new Uint8Array([128,128,0]));
    gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.NEAREST); gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.NEAREST);
  }
  function setPalette(hex){
    var px=new Uint8Array(hex.length*4);
    hex.forEach(function(h,i){ px[i*4]=parseInt(h.slice(1,3),16); px[i*4+1]=parseInt(h.slice(3,5),16); px[i*4+2]=parseInt(h.slice(5,7),16); px[i*4+3]=255; });
    palTex=gl.createTexture(); gl.activeTexture(gl.TEXTURE2); gl.bindTexture(gl.TEXTURE_2D,palTex);
    gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,hex.length,1,0,gl.RGBA,gl.UNSIGNED_BYTE,px);
    gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.NEAREST); gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.NEAREST);
  }
  // a smooth scale for one-number fields: 256 colours across lo..hi, read
  // with linear filtering so there are no steps
  function hexRGB(h){ return [parseInt(h.slice(1,3),16), parseInt(h.slice(3,5),16), parseInt(h.slice(5,7),16)]; }
  function scaleColor(stops, v){
    if(v<=stops[0][0]) return hexRGB(stops[0][1]);
    for(var i=1;i<stops.length;i++){
      if(v<=stops[i][0]){
        var a=hexRGB(stops[i-1][1]), b=hexRGB(stops[i][1]), f=(v-stops[i-1][0])/(stops[i][0]-stops[i-1][0]);
        return [0,1,2].map(function(k){ return Math.round(a[k]+(b[k]-a[k])*f); });
      }
    }
    return hexRGB(stops[stops.length-1][1]);
  }
  function setScale(sc){
    var px=new Uint8Array(256*4);
    for(var i=0;i<256;i++){ var c=scaleColor(sc.stops, sc.lo+i/255*(sc.hi-sc.lo)); px[i*4]=c[0]; px[i*4+1]=c[1]; px[i*4+2]=c[2]; px[i*4+3]=255; }
    palTex=gl.createTexture(); gl.activeTexture(gl.TEXTURE2); gl.bindTexture(gl.TEXTURE_2D,palTex);
    gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,256,1,0,gl.RGBA,gl.UNSIGNED_BYTE,px);
    gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR); gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE); gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);
  }
  // each city's number in a frame, read off the frame's own pixels
  var probe=document.createElement("canvas"), pctx=probe.getContext("2d",{willReadFrequently:true});
  function readCities(img){
    var sc=META.scale; if(!sc.cities) return null;
    probe.width=img.width; probe.height=img.height; pctx.drawImage(img,0,0);
    var d=pctx.getImageData(0,0,img.width,img.height).data;
    return sc.cities.map(function(c){
      var x=Math.min(img.width-1,Math.max(0,Math.round(c.x*img.width-.5))), y=Math.min(img.height-1,Math.max(0,Math.round(c.y*img.height-.5)));
      return sc.lo+d[(y*img.width+x)*4]/255*(sc.hi-sc.lo);
    });
  }
  function makeTex(img){
    var t=gl.createTexture(); gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D,t);
    gl.texImage2D(gl.TEXTURE_2D,0,gl.RGB,gl.RGB,gl.UNSIGNED_BYTE,img);
    gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR); gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE); gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);
    return t;
  }

  // ---- loading ----
  function image(url){ return new Promise(function(ok,no){ var i=new Image(); i.onload=function(){ok(i);}; i.onerror=function(){no(new Error(url));}; i.src=url; }); }
  function usable(){ var n=0; while(n<tex.length&&tex[n]) n++; return n; }     // frames ready from the start
  function load(){
    var my=++token;
    stopRecording(true);
    tex.concat(flow).forEach(function(t){ if(t) gl.deleteTexture(t); }); tex=[]; flow=[]; cityVals=[]; loaded=0; head=0; META=null; baseImg=topImg=null;
    $("help").textContent=HELP[KIND]; $("kind").value=KIND;
    wantVideo=false; savedNote=""; $("rec").textContent="Save as video"; $("note").textContent="loading…"; draw();
    var RK=encodeURIComponent(regionKey());
    fetch("/api/loop?model="+MODEL+"&region="+RK+"&kind="+KIND+(RUN?"&run="+RUN:"")).then(function(r){ return r.json(); }).then(function(m){
      if(my!==token) return;
      if(m.error) throw new Error(m.error);
      META=m; tex=new Array(m.minutes.length).fill(null); flow=new Array(m.minutes.length).fill(null);
      if(!$("model").options.length){
        m.models.forEach(function(x){ var o=document.createElement("option"); o.value=x.key; o.textContent=x.label; $("model").appendChild(o); });
        m.regions.forEach(function(x){ var o=document.createElement("option"); o.value=x.key; o.textContent=x.label; $("region").appendChild(o); });
      }
      $("model").value=MODEL; $("region").value=REGION;
      showRuns(m);
      if(m.kind==="radar") setPalette(m.colors); else setScale(m.scale);
      // The base map and the label sheet. A region nobody has opened before has
      // to have them built first, which can take minutes, so keep asking rather
      // than give up, and say so (see the note under the stage).
      function layer(name, tries){
        image("/api/loop/base?region="+RK+"&layer="+name+(tries?"&t="+tries:"")).then(function(i){
          if(my!==token) return;
          if(name==="base") baseImg=i; else topImg=i;
        }).catch(function(){
          if(my===token&&tries<40) setTimeout(function(){ layer(name, tries+1); }, 8000);
        });
      }
      layer("base",0); layer("top",0);
      // frames in order, four at a time: the loop can start before they are all in
      var next=0;
      function one(){
        if(my!==token||next>=m.minutes.length) return;
        var k=next++;
        image("/api/loop/frame?model="+MODEL+"&run="+m.run+"&region="+RK+"&m="+m.minutes[k]+(KIND==="radar"?"":"&kind="+KIND)).then(function(img){
          if(my!==token) return;
          tex[k]=makeTex(img); loaded++;
          if(KIND!=="radar") cityVals[k]=readCities(img);
          // asked for a video before the frames were in: start it now that they are
          if(loaded===m.minutes.length&&wantVideo){ wantVideo=false; startRecording(); }
        }).catch(function(){}).then(function(){
          // the motion from the frame before to this one: both now exist on the server
          if(k>0&&my===token&&KIND==="radar") image("/api/loop/flow?model="+MODEL+"&run="+m.run+"&region="+RK+"&m="+m.minutes[k-1])
            .then(function(img){ if(my===token) flow[k-1]=makeTex(img); }).catch(function(){});
        }).then(one);
      }
      for(var i=0;i<4;i++) one();
    }).catch(function(e){ if(my===token) $("note").textContent=String(e.message||e); });
  }

  // ---- which run ----
  // Each run by its Eastern start time, with the Zulu hour beside it. The newest
  // complete run plays unless another is picked; the arrows step one either way.
  function etRun(iso){
    var d=new Date(iso);
    return d.toLocaleString("en-US",{timeZone:"America/New_York",weekday:"short",hour:"numeric",timeZoneName:"short"})+" ("+("0"+d.getUTCHours()).slice(-2)+"Z)";
  }
  function showRuns(m){
    var sel=$("runsel"); sel.innerHTML="";
    m.runs.forEach(function(r,i){
      var o=document.createElement("option"); o.value=r.run;
      o.textContent=(r.ready>=r.of?"● ":"")+etRun(r.iso)+(i===0?"  newest":"");
      sel.appendChild(o);
    });
    if(!m.runs.some(function(r){ return r.run===m.run; })){
      var o=document.createElement("option"); o.value=m.run; o.textContent=etRun(m.run_iso); sel.appendChild(o);
    }
    sel.value=m.run;
    var at=sel.selectedIndex;
    $("runolder").disabled=at>=sel.options.length-1; $("runnewer").disabled=at<=0;
  }
  function setRun(r){ RUN=(META&&r===META.latest_run)?null:r; load(); }
  $("runsel").addEventListener("change",function(e){ setRun(e.target.value); });
  $("runolder").addEventListener("click",function(){ var s=$("runsel"); if(s.selectedIndex<s.options.length-1) setRun(s.options[s.selectedIndex+1].value); });
  $("runnewer").addEventListener("click",function(){ var s=$("runsel"); if(s.selectedIndex>0) setRun(s.options[s.selectedIndex-1].value); });

  // ---- drawing ----
  function rounded(x,y,w,h,r){ ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }
  function clock(min){
    var d=new Date(Date.parse(META.run_iso)+min*60000);
    var p=new Intl.DateTimeFormat("en-US",{timeZone:META.tz,weekday:"short",hour:"numeric",minute:"2-digit",timeZoneName:"short"}).formatToParts(d), o={};
    p.forEach(function(x){ o[x.type]=x.value; });
    return {day:o.weekday.toUpperCase(), time:o.hour+":"+o.minute+" "+o.dayPeriod, zone:o.timeZoneName};
  }
  function draw(){
    ctx.fillStyle="#fff"; ctx.fillRect(0,0,W,H);
    if(baseImg) ctx.drawImage(baseImg,0,HEAD,MW,MH); else { ctx.fillStyle="#c9d8e4"; ctx.fillRect(0,HEAD,MW,MH); }
    var n=usable(), min=0;
    if(META&&n>0){
      var pos=Math.min(head,n-1), a=Math.floor(pos), b=Math.min(a+1,n-1);
      min=META.minutes[a]+(pos-a)*META.step;
      gl.viewport(0,0,MW,MH); gl.clearColor(0,0,0,0); gl.clear(gl.COLOR_BUFFER_BIT);
      gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D,tex[a]);
      gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D,tex[b]);
      gl.activeTexture(gl.TEXTURE2); gl.bindTexture(gl.TEXTURE_2D,palTex);
      gl.activeTexture(gl.TEXTURE3); gl.bindTexture(gl.TEXTURE_2D,(b>a&&flow[a])||stillTex);
      gl.uniform2f(U.fs, META.flow_scale/META.frame_w, META.flow_scale/META.frame_h);
      gl.uniform1f(U.t,pos-a);
      var sc=META.scale||{};
      gl.uniform1i(U.mode, META.kind==="radar"?0:1);
      if(META.kind!=="radar"){
        gl.uniform1f(U.lo,sc.lo); gl.uniform1f(U.hi,sc.hi); gl.uniform1f(U.alpha,sc.alpha);
        gl.uniform1f(U.c0,sc.clear?sc.clear[0]:0); gl.uniform1f(U.c1,sc.clear?sc.clear[1]:0);
      }
      gl.drawArrays(gl.TRIANGLE_STRIP,0,4);
      ctx.drawImage(glc,0,HEAD);
    }
    if(topImg) ctx.drawImage(topImg,0,HEAD,MW,MH);
    if(!META) return;
    if(META.kind!=="radar"&&n>0) drawCityValues(Math.min(head,n-1));

    var c=clock(min), total=META.minutes.length-1, at=total?Math.min(head,total)/total:0;
    if(TALL){
      // Two bands of the same height, top and bottom, each set from the left and each
      // edged with the same accent line on its inner side: the name and a large
      // day and time above (the thing a viewer has to read at a glance), the
      // legend and whose map it is below. The map between them is left clear.
      // Inside each band the text has the same space above it as below it.
      var bh=276, by=H-bh, band="rgba(15,23,35,.95)";
      ctx.fillStyle=band; ctx.fillRect(0,0,W,bh); ctx.fillRect(0,by,W,bh);
      ctx.textBaseline="middle";
      // top: name line, then the time, centred as one group
      var L=36;                                           // everything in both bands starts on this left edge
      ctx.textAlign="left"; ctx.fillStyle="#b9c8da"; ctx.font='600 36px "Barlow Condensed", Barlow, sans-serif';
      ctx.fillText(META.title.toUpperCase()+"  ·  "+META.name.toUpperCase(), L, 74);
      var big='600 122px "Barlow Condensed", Barlow, sans-serif', zf='500 42px "Barlow Condensed", Barlow, sans-serif';
      ctx.font=big; var wDay=ctx.measureText(c.day).width, wTime=ctx.measureText(c.time).width;
      ctx.font=zf; var wZone=ctx.measureText(c.zone).width;
      var chip=wDay+36, tw=chip+22+wTime+14+wZone, tx=L, cy=160;
      ctx.fillStyle="#4ea3ff"; rounded(tx,cy-56,chip,112,10); ctx.fill();
      ctx.textAlign="left"; ctx.font=big;
      ctx.fillStyle="#04121f"; ctx.fillText(c.day, tx+18, cy+6);
      ctx.fillStyle="#fff"; ctx.fillText(c.time, tx+chip+22, cy+6);
      ctx.font=zf; ctx.fillStyle="#b9c8da"; ctx.fillText(c.zone, tx+chip+22+wTime+14, cy+30);
      // inner edges: progress along the top band's, a plain line along the bottom's
      ctx.fillStyle="#243244"; ctx.fillRect(0,bh,W,8); ctx.fillRect(0,by-8,W,8);
      ctx.fillStyle="#4ea3ff"; ctx.fillRect(0,bh,W*at,8); ctx.fillRect(0,by-8,W,8);
      // bottom: the legend, then the name of the site, mirroring the top
      if(META.kind!=="radar") drawScale(L, by+36, W-2*L, 1.25, true);
      else {
      ctx.font='600 30px Barlow, sans-serif';
      var sw=26, gapG=36, widths=META.groups.map(function(g){ return ctx.measureText(g).width+12+6*sw; });
      var lw=widths.reduce(function(a,b){return a+b;},0)+gapG*(widths.length-1), x=L, ly=by+86;
      META.groups.forEach(function(g,n){
        ctx.textAlign="left"; ctx.fillStyle="#fff"; ctx.font='600 30px Barlow, sans-serif';
        ctx.fillText(g, x, ly+2); var gx=x+ctx.measureText(g).width+12;
        for(var i=0;i<6;i++){ ctx.fillStyle=META.colors[n*6+i]; ctx.fillRect(gx+i*sw, ly-14, sw+1, 30); }
        x+=widths[n]+gapG;
      });
      }
      ctx.textAlign="left"; ctx.fillStyle="#fff"; ctx.font='600 52px "Barlow Condensed", Barlow, sans-serif';
      ctx.fillText("ryansajdak.com", L, by+148);
      ctx.fillStyle="#8ea3bd"; ctx.font='500 22px Barlow, sans-serif';
      ctx.fillText("Data: "+META.credit, L, by+199);
      return;
    }
    // header
    ctx.textBaseline="middle"; ctx.fillStyle="#111";
    ctx.font='600 44px "Barlow Condensed", Barlow, sans-serif'; ctx.textAlign="left";
    ctx.fillText(META.name+"  ·  "+META.title, 26, HEAD/2+2);
    ctx.textAlign="right"; ctx.font='600 34px "Barlow Condensed", Barlow, sans-serif';
    ctx.fillText("ryansajdak.com", W-26, HEAD/2+2);
    drawClock(c, 26, HEAD+24, 1, false);
    if(META.kind==="radar") drawLegend(26, H-26-126, 1);
    else {
      ctx.fillStyle="rgba(255,255,255,.90)"; rounded(26, H-26-104, 640, 104, 10); ctx.fill();
      drawScale(44, H-26-90, 604, 1, false);
    }
    // credit and a thin line showing where in the loop this is
    ctx.textAlign="right"; ctx.font='500 19px Barlow, sans-serif';
    ctx.lineWidth=4; ctx.strokeStyle="rgba(255,255,255,.85)"; ctx.fillStyle="#333";
    ctx.strokeText("Data: "+META.credit, W-20, H-26); ctx.fillText("Data: "+META.credit, W-20, H-26);
    ctx.fillStyle="rgba(15,23,35,.25)"; ctx.fillRect(0,H-8,W,8);
    ctx.fillStyle="#4ea3ff"; ctx.fillRect(0,H-8,W*at,8);
  }

  // the clock, the thing a futurecast is read by (k scales it for the reel)
  function drawClock(c, x, y, k, onDark){
    var big='600 '+Math.round(62*k)+'px "Barlow Condensed", Barlow, sans-serif', small='500 '+Math.round(30*k)+'px "Barlow Condensed", Barlow, sans-serif';
    ctx.textBaseline="middle"; ctx.textAlign="left";
    ctx.font=big; var wDay=ctx.measureText(c.day).width, wTime=ctx.measureText(c.time).width;
    ctx.font=small; var wZone=ctx.measureText(c.zone).width;
    var p=22*k, h=86*k, bw=p+wDay+p+wTime+14*k+wZone+24*k;
    ctx.fillStyle=onDark?"#1b2634":"rgba(15,23,35,.92)"; rounded(x,y,bw,h,12*k); ctx.fill();
    ctx.fillStyle="#4ea3ff"; rounded(x,y,p+wDay+p/2,h,12*k); ctx.fill(); ctx.fillRect(x+12*k,y,wDay+p-1*k,h);
    ctx.font=big; ctx.fillStyle="#04121f"; ctx.fillText(c.day, x+p, y+h*0.535);
    ctx.fillStyle="#fff"; ctx.fillText(c.time, x+p+wDay+p, y+h*0.535);
    ctx.font=small; ctx.fillStyle="#b9c8da"; ctx.fillText(c.zone, x+p+wDay+p+wTime+14*k, y+h*0.63);
  }
  // the number at each city, between the two frames either side of now
  function drawCityValues(pos){
    var sc=META.scale, a=Math.floor(pos), b=Math.min(a+1,META.minutes.length-1), f=pos-a;
    var va=cityVals[a], vb=cityVals[b]||va; if(!va||!sc.cities) return;
    var big=TALL?44:34;
    ctx.textAlign="center"; ctx.textBaseline="alphabetic"; ctx.lineJoin="round";
    sc.cities.forEach(function(c,i){
      var v=va[i]+(vb[i]-va[i])*f;
      if(META.kind==="gust"&&v<sc.clear[0]) return;           // calm: nothing to say
      var x=c.x*MW, y=HEAD+c.y*MH-(TALL?16:12), txt=String(Math.round(v))+(META.kind==="temp"?"°":"");
      ctx.font='600 '+Math.round(c.major?big:big*0.82)+'px "Barlow Condensed", Barlow, sans-serif';
      ctx.lineWidth=TALL?7:6; ctx.strokeStyle="rgba(15,23,35,.88)"; ctx.strokeText(txt,x,y);
      ctx.fillStyle="#fff"; ctx.fillText(txt,x,y);
    });
  }
  // a smooth colour bar with its numbers under it (onDark: in the reel's band)
  function drawScale(x, y, w, k, onDark){
    var sc=META.scale, t=sc.ticks, pad=(t[1]-t[0])/2, v0=t[0]-pad, v1=t[t.length-1]+pad, bh=30*k;
    ctx.textBaseline="middle"; ctx.textAlign="left";
    ctx.font='600 '+Math.round(24*k)+'px Barlow, sans-serif'; ctx.fillStyle=onDark?"#fff":"#111";
    var lab=META.kind_label+" ("+sc.unit+")"; ctx.fillText(lab, x, y+bh/2);
    var bx=x+ctx.measureText(lab).width+18*k, bw=w-(bx-x);
    for(var i=0;i<bw;i+=2){ var c=scaleColor(sc.stops, v0+(v1-v0)*i/bw); ctx.fillStyle="rgb("+c+")"; ctx.fillRect(bx+i,y,2.5,bh); }
    ctx.textAlign="center"; ctx.font='500 '+Math.round(21*k)+'px Barlow, sans-serif'; ctx.fillStyle=onDark?"#b9c8da":"#333";
    t.forEach(function(v){ var tx=bx+(v-v0)/(v1-v0)*bw; ctx.fillRect(tx-1,y+bh,2,7*k); ctx.fillText(String(v), tx, y+bh+22*k); });
  }
  function drawLegend(lx, ly, k){
    var lw=330*k, lh=126*k;
    ctx.fillStyle="rgba(255,255,255,.90)"; rounded(lx,ly,lw,lh,10*k); ctx.fill();
    ctx.textBaseline="middle"; ctx.textAlign="left";
    META.groups.forEach(function(g,n){
      var yy=ly+(18+n*36)*k;
      ctx.font='600 '+Math.round(24*k)+'px Barlow, sans-serif'; ctx.fillStyle="#111"; ctx.fillText(g, lx+16*k, yy+11*k);
      for(var i=0;i<6;i++){ ctx.fillStyle=META.colors[n*6+i]; ctx.fillRect(lx+(86+i*26)*k, yy, 26*k+1, 22*k); }
    });
    ctx.font='500 '+Math.round(19*k)+'px Barlow, sans-serif'; ctx.fillStyle="#5a6570";
    ctx.fillText("light", lx+252*k, ly+22*k); ctx.fillText("to heavy", lx+252*k, ly+46*k);
  }

  // ---- playback ----
  var SECONDS={hrrr:12, nam:15, gfs:15, ecmwf:15};       // one pass at normal speed
  function tick(now){
    requestAnimationFrame(tick);
    var dt=Math.min(0.1,(now-last)/1000); last=now;
    var n=usable();
    if(META&&playing&&n>1){
      var end=n-1, rate=(META.minutes.length-1)/SECONDS[MODEL]*(recorder?1:parseFloat($("speed").value));
      if(head>=end){                                      // rest on the last frame, then go round
        hold+=dt;
        if(recorder&&hold>0.8){ stopRecording(false); }
        else if(hold>1.2){ head=0; hold=0; }
      } else { head=Math.min(end, head+rate*dt); }
    }
    if(META){
      $("scrub").max=Math.max(1,(META.minutes.length-1)*10); if(document.activeElement!==$("scrub")) $("scrub").value=Math.round(head*10);
      var total=META.minutes.length-1;
      if(recorder) $("rec").textContent="Recording "+Math.round(100*Math.min(head,total)/total)+"% (cancel)";
      else if(wantVideo) $("rec").textContent="Video starts when loaded (cancel)";
      $("note").textContent=(!baseImg||!topImg) ? "preparing this region's map (first time only, can take a few minutes)…"
        : loaded<META.minutes.length ? "loading weather "+loaded+" of "+META.minutes.length
        : recorder ? "recording the whole loop, it saves itself at the end"
        : savedNote || (new Date(META.run_iso).toLocaleString("en-US",{timeZone:"America/New_York",weekday:"short",hour:"numeric",timeZoneName:"short"})+" run ("+META.run.slice(8)+"Z), "+META.minutes.length+" times");
    }
    draw();
  }

  // ---- video ----
  function stopRecording(discard){
    if(!recorder) return;
    var r=recorder; recorder=null; r._discard=discard; try{ r.stop(); }catch(e){}
    $("rec").textContent="Save as video";
  }
  // One press records the whole loop: back to the start, through to the end at
  // normal speed, a short rest on the last frame, then the file downloads by
  // itself. Pressing again while it runs cancels it.
  function startRecording(){
    if(!window.MediaRecorder){ savedNote="this browser cannot record video"; return; }
    var types=["video/mp4;codecs=avc1.640028","video/mp4","video/webm;codecs=vp9","video/webm"], type=types.filter(function(t){ return MediaRecorder.isTypeSupported(t); })[0];
    var chunks=[], rec=new MediaRecorder(stage.captureStream(30),{mimeType:type,videoBitsPerSecond:14000000});
    rec.ondataavailable=function(e){ if(e.data.size) chunks.push(e.data); };
    rec.onstop=function(){
      if(rec._discard) return;
      var name="futurecast_"+(KIND==="radar"?"":KIND+"_")+MODEL+"_"+REGION+(TALL?"_vertical":"")+"_"+META.run+(type.indexOf("mp4")>=0?".mp4":".webm");
      var a=document.createElement("a"); a.href=URL.createObjectURL(new Blob(chunks,{type:type})); a.download=name;
      document.body.appendChild(a); a.click(); a.remove();
      savedNote="saved "+name;
    };
    head=0; hold=0; playing=true; savedNote=""; $("play").textContent="Pause";
    recorder=rec; rec.start();
  }
  $("rec").addEventListener("click",function(){
    if(recorder){ stopRecording(true); return; }
    if(wantVideo){ wantVideo=false; $("rec").textContent="Save as video"; return; }
    if(!META||loaded<META.minutes.length){ wantVideo=true; $("rec").textContent="Video starts when loaded (cancel)"; return; }
    startRecording();
  });
  // a hidden tab stops drawing, which would leave a recording running forever
  document.addEventListener("visibilitychange",function(){
    if(document.hidden&&recorder){ stopRecording(true); savedNote="recording cancelled: keep this tab in front while it records"; }
  });

  // ---- controls ----
  $("play").addEventListener("click",function(){
    if(recorder) stopRecording(true);                 // pausing would stall the recording; cancel it instead
    playing=!playing; $("play").textContent=playing?"Pause":"Play";
  });
  $("scrub").addEventListener("input",function(e){ head=Math.min(Math.max(0,usable()-1), e.target.value/10); hold=0; });
  $("kind").addEventListener("change",function(e){ KIND=e.target.value; try{ localStorage.setItem("loopkind",KIND); }catch(x){} load(); });
  $("model").addEventListener("change",function(e){ MODEL=e.target.value; RUN=null; try{ localStorage.setItem("loopmodel",MODEL); }catch(x){} load(); });
  $("region").addEventListener("change",function(e){ REGION=e.target.value; try{ localStorage.setItem("loopregion",REGION); }catch(x){} load(); });
  $("shape").addEventListener("change",function(e){ TALL=e.target.value==="tall"; try{ localStorage.setItem("loopshape",TALL?"tall":"wide"); }catch(x){} setShape(); load(); });
  document.addEventListener("keydown",function(e){
    if(e.target.tagName==="SELECT"||e.target.tagName==="INPUT") return;
    if(e.code==="Space"){ e.preventDefault(); $("play").click(); }
  });

  if(!gl){ $("note").textContent="this browser has no WebGL 2"; return; }
  initGL(); setShape(); $("shape").value=TALL?"tall":"wide";
  // the stage draws its own type, so the fonts have to be in before the first frame
  var fonts=document.fonts?Promise.all([document.fonts.load('600 44px "Barlow Condensed"'),document.fonts.load('500 30px "Barlow Condensed"'),document.fonts.load('600 24px Barlow'),document.fonts.load('500 19px Barlow')]):Promise.resolve();
  fonts.catch(function(){}).then(function(){ load(); requestAnimationFrame(function(t){ last=t; tick(t); }); });
})();
</script>
</body>
